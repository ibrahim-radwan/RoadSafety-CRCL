# Conda environment for the capture / sync / report / replay / flashing tools.
# Exported from the working Jetson AGX Orin (L4T R35.4.1, JetPack 5.1.2) on 2026-10-13.
#
#   conda env create -f environment/rel_1_py_3_8.yml
#
# NOT included here (vendor wheels, installed separately - see docs/NEW_BOARD_SETUP.md):
#   pyzed 4.1          ZED SDK 4.1.4  ->  python /usr/local/zed/get_python_api.py
#   torch 2.1.0a0+41361538.nv23.06   NVIDIA PyTorch wheel for JetPack 5 (CUDA)
#   torchvision 0.16.0               built from source against that torch
#   (CuPy is no longer used: the old radar chain it accelerated was retired on 2026-10-25)
#
# The pip list below cannot be installed as is (2026-10-24): fpga-udp is not on PyPI, and
# ultralytics pulls a CPU-only torch from PyPI over the CUDA one. Neither is imported by the
# repo. Follow docs/NEW_BOARD_SETUP.md section 3.

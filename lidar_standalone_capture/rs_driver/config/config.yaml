lidar:
  lidar_type: RSFAIRY          #  LiDAR type - RS16, RS32, RSBP, RSAIRY, RSAIRYLITE_ETH, RSFAIRY, RSHELIOS, RSHELIOS_16P, RS128, RS80,
                            # RS48, RSP128, RSP80, RSP48,RSM1, RSM1_JUMBO, RSM2, RSM3, RSE1, RSMX, RSEMX.
                           
  msop_port: 6699              #  Msop port of lidar
  difop_port: 7788             #  Difop port of lidar (Note that: For RSEMX, use the port num of DIFOP2 if both DIFOP1 & DIFOP2 exist.
                              # Default 7766.)
  imu_port: 6688               #  IMU port of lidar(only for RSAIRY, RSAIRYLITE_ETH, RSFAIRY, RSE1), 0 means no imu.
                              # If you want to use IMU, please first set ENABLE_IMU_DATA_PARSE to ON in CMakeLists.txt 
  user_layer_bytes: 0          #  Bytes of user layer. thers is no user layer if it is 0         
  tail_layer_bytes: 0          #  Bytes of tail layer. thers is no tail layer if it is 0


  min_distance: 0.0            #  Minimum distance of point cloud
  max_distance: 150            #  Maximum distance of point cloud (Note that: 200 normally, 300 for RSEMX)
  use_lidar_clock: true        #  true--Use the lidar clock as the message timestamp
                              #  false-- Use the system clock as the timestamp
                              
  dense_points: true           #  true: discard NAN points; false: reserve NAN points

  ts_first_point: true         #  true: time-stamp point cloud with the first point; false: with the last point;   
                              #  these parameters are used from mechanical lidar

  start_angle: 0               #  Start angle of point cloud
  end_angle: 360               #  End angle of point cloud
  split_angle: 180             #  Sweep boundary (deg). 180 = behind, so the forward (radar) field of view
                              # is scanned mid-sweep in one pass. rs_driver's default 0 splits it in two.


network:
  lidar_ip: "192.168.34.200"
  host_ip: "192.168.34.30"

calibration:
  x: 0.016407408292000027      # gyro bias x
  y: -0.011695323812000565     # gyro bias y
  z: -0.0028640687432000293    # gyro bias z